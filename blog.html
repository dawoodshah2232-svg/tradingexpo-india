<style>
.txi-blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:40px 0 90px}
@media(max-width:960px){.txi-blog-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.txi-blog-grid{grid-template-columns:1fr;max-width:560px;margin-left:auto;margin-right:auto}}
.txi-post-card{display:block;text-decoration:none;color:inherit;background:var(--card,#10151b);border:1px solid var(--border,#232b34);border-radius:18px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.txi-post-card:hover{transform:translateY(-6px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.txi-post-card img{width:100%;height:210px;object-fit:cover;display:block}
.txi-post-body{padding:26px}
.txi-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#00C853;margin-bottom:12px}
.txi-post-body h2{font-size:1.22rem;line-height:1.4;margin:0 0 10px}
.txi-post-body p{color:var(--muted,#9aa3ad);font-size:.94rem;line-height:1.65;margin:0 0 16px}
.txi-meta{font-size:.8rem;color:var(--muted,#9aa3ad)}
.txi-blog-tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:44px 0 8px}
.txi-search{flex:1;min-width:240px;position:relative}
.txi-search input{width:100%;padding:14px 18px 14px 46px;border-radius:999px;border:1px solid var(--border,#232b34);background:var(--card,#10151b);color:inherit;font-family:inherit;font-size:.95rem}
.txi-search input:focus{outline:none;border-color:#00C853}
.txi-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.55}
.txi-filters{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 0}
.txi-filter{padding:9px 18px;border-radius:999px;border:1px solid var(--border,#232b34);background:transparent;color:inherit;font-family:inherit;font-size:.83rem;font-weight:600;cursor:pointer;transition:all .25s}
.txi-filter:hover{border-color:#00C853;color:#00C853}
.txi-filter.active{background:#00C853;border-color:#00C853;color:#06130b}
.txi-count{font-size:.85rem;color:var(--muted,#9aa3ad);margin:18px 0 0}
.txi-empty{text-align:center;padding:60px 20px;color:var(--muted,#9aa3ad);grid-column:1/-1}
</style>

<body data-page="blog">
<div id="siteHeader"></div>
<main>
<section class="page-hero has-img" style="--ph-img:url('assets/img/india-traders.jpg')"><div class="container">
<p class="eyebrow">Blog</p>
<h1>Insights from the editorial team.</h1>
<p class="section-lead">55 in-depth guides on forex, crypto, trading strategies, risk management and fintech for Indian traders — plus everything about Trading Expo India 2027.</p>
</div></section>
<section class="section"><div class="container">
<div class="txi-blog-tools">
<div class="txi-search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="search" id="blogSearch" placeholder="Search articles… (e.g. crypto tax, SEBI, stop-loss)" aria-label="Search articles">
</div>
</div>
<div class="txi-filters" id="blogFilters" role="group" aria-label="Filter by category"></div>
<p class="txi-count" id="blogCount"></p>
<div class="txi-blog-grid" id="blogGrid"></div>
</div></section>
</main>
<div id="siteFooter"></div>
<button class="to-top" id="toTop" aria-label="Back to top">↑</button>
<script src="script.js?v=20260925a"></script>
<script>
(function(){
  var grid=document.getElementById('blogGrid'),filters=document.getElementById('blogFilters'),
      search=document.getElementById('blogSearch'),count=document.getElementById('blogCount');
  var posts=[],activeCat='All';
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function card(p){
    return '<a class="txi-post-card" href="'+p.file+'">'+
      '<img src="assets/img/'+p.img+'" alt="'+esc(p.title)+'" loading="lazy">'+
      '<div class="txi-post-body"><span class="txi-tag">'+esc(p.category)+'</span>'+
      '<h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p>'+
      '<span class="txi-meta">Editorial team &middot; '+esc(p.date)+' &middot; '+esc(p.read)+'</span></div></a>';
  }
  function render(){
    var q=search.value.trim().toLowerCase();
    var list=posts.filter(function(p){
      var okCat=activeCat==='All'||p.category===activeCat;
      var okQ=!q||(p.title+' '+p.excerpt+' '+p.category).toLowerCase().indexOf(q)>-1;
      return okCat&&okQ;
    });
    grid.innerHTML=list.length?list.map(card).join(''):'<div class="txi-empty"><h3>No articles found</h3><p>Try a different search term or category.</p></div>';
    count.textContent='Showing '+list.length+' of '+posts.length+' articles';
  }
  fetch('assets/blog-index.json').then(function(r){return r.json();}).then(function(data){
    posts=data;
    var cats=['All'].concat([...new Set(posts.map(function(p){return p.category;}))]);
    filters.innerHTML=cats.map(function(c){
      return '<button class="txi-filter'+(c==='All'?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('');
    filters.addEventListener('click',function(e){
      var b=e.target.closest('.txi-filter');if(!b)return;
      activeCat=b.getAttribute('data-cat');
      filters.querySelectorAll('.txi-filter').forEach(function(x){x.classList.toggle('active',x===b);});
      render();
    });
    var t;search.addEventListener('input',function(){clearTimeout(t);t=setTimeout(render,180);});
    render();
  }).catch(function(){grid.innerHTML='<div class="txi-empty"><p>Could not load articles. Please refresh.</p></div>';});
})();
</script>
</body>
