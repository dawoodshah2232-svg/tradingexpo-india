    {
      "@type": "Question",
      "name": "How many brokers should I compare at an expo?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Three to five is the sweet spot. Fewer and you have no real basis for comparison; more and the booths blur together and decision fatigue sets in. Shortlist in advance if the exhibitor list is published, and give each shortlisted broker at least 15–20 minutes including a live platform demo."
      }
    },
    {
      "@type": "Question",
      "name": "Can I trust the offers brokers advertise at expos?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Treat expo offers as starting points, not facts, until you have the full terms in writing. Ask for the complete charges schedule, the offer's conditions and expiry, and confirm the broker's SEBI registration independently. Genuine promotions survive scrutiny; pressure tactics do not."
      }
    },
    {
      "@type": "Question",
      "name": "Should I open an account on the spot or decide later?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Decide later, with almost no exceptions. Use the expo to gather information, watch live demos and collect written fee schedules. Real offers do not evaporate on Monday morning, and a broker worth your money will still welcome you after the event."
      }
    },
    {
      "@type": "Question",
      "name": "What is the single most important thing to check at a broker booth?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "SEBI registration. Before costs, platforms or offers, confirm the broker is registered with SEBI and check the registration on SEBI's own records. An unregistered operator's attractive pricing is worthless — regulation is the foundation every other comparison stands on."
      }
    }
  ]
