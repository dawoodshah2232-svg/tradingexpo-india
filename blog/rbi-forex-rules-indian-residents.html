      "acceptedAnswer": {
        "@type": "Answer",
        "text": "FEMA (Foreign Exchange Management Act, 1999) is India's law governing foreign exchange transactions. It keeps most current-account transactions free while regulating capital-account transactions, including sending money abroad for speculative trading."
      }
    },
    {
      "@type": "Question",
      "name": "How much can I remit abroad under LRS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Resident individuals can remit up to USD 250,000 per financial year under the Liberalised Remittance Scheme for permitted purposes. Margin trading and speculative forex activity on overseas platforms are not permitted uses."
      }
    },
    {
      "@type": "Question",
      "name": "Can FEMA violations affect my bank account?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Banks monitor forex-related transfers and can freeze accounts linked to suspicious activity, while enforcement agencies can impose penalties up to three times the sum involved in a contravention."
      }
