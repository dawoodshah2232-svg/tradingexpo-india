        "@type": "Answer",

      "name": "Can a SEBI-registered broker offer forex trading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "SEBI-registered brokers can offer exchange-traded currency derivatives (such as USD–INR futures and options) on Indian exchanges like NSE and BSE. They cannot offer offshore-style spot forex or CFD products."
