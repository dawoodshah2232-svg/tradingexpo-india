      "@type": "Question",
      "name": "What is the Jane Street–SEBI case about?",
      "acceptedAnswer": {
        "text": "In an interim order dated 3 July 2025, SEBI accused New York-based trading firm Jane Street of manipulating India's equity derivatives market through coordinated trading in cash and derivatives on expiry days, focused on the Bank Nifty (18 key trading days between January 2023 and March 2025) and the Nifty (three expiry days in May 2025). The regulator impounded about ₹4,843 crore of alleged unlawful gains. Jane Street denied the allegations and challenged the order before the Securities Appellate Tribunal."
      }
    },
    {
      "@type": "Question",
      "name": "What did Jane Street argue at the SAT hearing on 5 October 2026?",
      "acceptedAnswer": {
        "text": "Jane Street's counsel said surveillance reviews by the NSE and SEBI's own Integrated Surveillance Department had found no evidence of manipulation in 48 of 53 trading periods examined — over 90% — and that the Bank Nifty had moved contrary to the alleged manipulative direction. The firm sought full inspection of SEBI's investigative materials, arguing that withholding documents would breach principles of natural justice."
      }
    },
    {
      "@type": "Question",
      "name": "Has Jane Street resumed trading in India?",
      "acceptedAnswer": {
        "text": "No. Jane Street deposited the ₹4,843 crore impounded by SEBI's interim order but has not resumed trading in Indian markets. The appeal before the Securities Appellate Tribunal continues, with hearings held on 5 October 2026 and 6 October 2026."
      }
    }
  ]
