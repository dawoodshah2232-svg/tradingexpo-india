        "@type": "Answer",
        "text": "A 1% tax deducted at source applies on VDA transfers above thresholds, deposited against the seller's PAN. Compliant Indian exchanges usually handle it automatically; P2P traders must manage it themselves."

      "@type": "Question",
      "name": "Can I offset crypto losses against crypto gains?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Under the current framework, losses from VDAs cannot be set off against gains from VDAs or any other income, and cannot be carried forward to future years."
