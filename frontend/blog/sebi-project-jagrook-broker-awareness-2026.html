      "name": "What is SEBI's Project Jagrook circular of October 2026?",
      "acceptedAnswer": {
        "text": "On 1 October 2026 SEBI directed all stock brokers to prominently display standardised investor awareness messages on their websites and mobile trading apps under Project Jagrook, its nationwide investor education initiative. The rollout is phased: websites must show the messages from 5 October, with mandatory display on the landing page from 1 November; on trading apps the display is voluntary until 31 October, then mandatory on alternate days from 1 November."
      }
    },
    {
      "@type": "Question",
      "name": "What is World Investor Week 2026?",
      "acceptedAnswer": {
        "text": "World Investor Week is IOSCO's global campaign for investor education and protection. The tenth edition runs from 5 to 11 October 2026 across more than 100 jurisdictions, with the primary themes Investor Resilience, Digital Deception and Scam Alert, and the tagline 'Invest in Your Future. Protect It Today.' SEBI's Project Jagrook rollout coincides with the campaign."
      }
    },
    {
      "@type": "Question",
      "name": "Should I trust a broker's website just because it shows SEBI's awareness messages?",
      "acceptedAnswer": {
        "text": "No. The messages are a regulator-supplied education banner that every compliant broker must show — they are not a trust badge for the broker itself. Always verify a broker's SEBI registration number, check its exchange memberships, and watch for red flags such as guaranteed returns or pressure to deposit. The awareness messages are there to remind you to do exactly that."
      }
    }
  ]
