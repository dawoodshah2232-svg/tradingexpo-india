      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Since March 2023, virtual digital asset service providers serving India must register with the Financial Intelligence Unit as reporting entities under the PMLA, implementing KYC, transaction monitoring and regulatory reporting."

      "@type": "Question",
      "name": "Does FIU registration make an exchange safe?",
      "acceptedAnswer": {
        "@type": "Answer",
